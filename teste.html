<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    connect-src 'self';
    frame-src 'self';
    base-uri 'none';
    form-action 'none';
  ">
  <title>DiaristaExpress</title>
  <link rel="stylesheet" href="./teste.css?v=2.11.3">
</head>
<body class="modo-computador">
  <header class="barra">
    <!-- Sem marca aqui: o proprio app ja' mostra o nome logo abaixo. -->
    <span></span>

    <div class="alternar" role="group" aria-label="Como ver o app">
      <button type="button" data-modo="computador">Computador</button>
      <button type="button" data-modo="celular">Celular</button>
    </div>

    <div class="barra__fim">
      <label class="escolha">
        <span class="visualmente-oculto">Qual app</span>
        <select id="qual-app">
          <option value="cliente">App do cliente</option>
          <option value="diarista">App do profissional</option>
        </select>
      </label>
      <button type="button" id="novidade" class="novidade" hidden>Atualizar</button>
      <button type="button" id="versao" class="versao" title="Procurar versão nova">versão ...</button>
    </div>
  </header>

  <main class="vista">
    <div class="tela">
      <iframe id="quadro" title="DiaristaExpress"></iframe>
    </div>
  </main>

  <script src="./teste.js?v=2.11.3"></script>
</body>
</html>
