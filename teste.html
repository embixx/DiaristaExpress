<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    connect-src 'self';
    frame-src 'self';
    base-uri 'none';
    form-action 'none';
  ">
  <title>DiaristaExpress · computador e celular</title>
  <link rel="stylesheet" href="./teste.css?v=2.11.2">
</head>
<body>
  <header class="topo">
    <div class="topo__marca"><b>Diarista</b><span>Express</span><small>modo de teste</small></div>
    <div class="topo__app" role="group" aria-label="Qual app mostrar">
      <button type="button" data-app="cliente">Cliente</button>
      <button type="button" data-app="diarista">Profissional</button>
    </div>
    <div class="topo__versao">
      <span id="versao">versão ...</span>
      <button type="button" id="atualizar" class="topo__atualizar">Atualizar</button>
    </div>
  </header>

  <div id="aviso" class="aviso-versao" hidden>
    <span id="aviso-texto">Nova versão no ar.</span>
    <button type="button" id="aviso-botao">Atualizar agora</button>
  </div>

  <main class="palco">
    <section class="quadro quadro--computador">
      <h2>Computador</h2>
      <div class="quadro__area" id="area-computador">
        <iframe id="computador" title="App no computador" data-largura="1280" data-altura="800"></iframe>
      </div>
    </section>
    <section class="quadro quadro--celular">
      <h2>Celular</h2>
      <div class="quadro__area" id="area-celular">
        <div class="aparelho">
          <iframe id="celular" title="App no celular" data-largura="390" data-altura="844"></iframe>
        </div>
      </div>
    </section>
  </main>

  <p class="rodape">As duas telas são o mesmo app, com a mesma conta: o que você faz numa aparece na outra.
    No celular de verdade, abra <a href="./">embixx.github.io/DiaristaExpress</a>.</p>

  <script src="./teste.js?v=2.11.2"></script>
</body>
</html>
