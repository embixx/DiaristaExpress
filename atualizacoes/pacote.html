.abas {

.aba {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 56px;

  opacity: 0;
}
.aba { z-index: 1; }
.abas--pilula .abas__pilula { opacity: 1; }
.abas--pilula .aba[aria-current='page'] .aba__icone { background: transparent; }
.aba__marcador {
  position: absolute;
  top: 2px; left: calc(50% + 10px);
  min-width: 18px; height: 18px; padding: 0 4px;
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 800; color: var(--marcador-texto);
  background: var(--marcador-fundo); border-radius: var(--r-full);

}

.cartao {
  display: block;
  background: var(--ladrilho);
  border: 1px solid transparent;
  border-radius: 20px;
  padding: var(--e4);
  color: var(--texto);
}
.cartao--liso { border-color: var(--borda); }
.cartao--suave { background: var(--ladrilho); border-color: transparent; }
.cartao--clicavel {
  width: 100%;

  transition: transform 90ms ease-out, filter var(--rapido);
}
@media (hover: hover) {

}
.cartao--clicavel:active { transform: scale(.985); box-shadow: none; }

.cartao--suave.cartao--clicavel { background: var(--ladrilho); }
.cartao--destaque { border: 1.5px solid var(--marca); box-shadow: 4px 4px 0 var(--marca); }

}

  --btn-fundo: var(--marca);

  --btn-base: var(--marca-base);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--e2);
  min-height: 50px;
  padding: 0 var(--e5);
  margin-bottom: var(--btn-curso);
  font-size: var(--t-md);
  font-weight: 700;
  letter-spacing: -0.01em;
  text-align: center;
  color: var(--btn-texto);
  background: var(--btn-fundo);
  border: 1.5px solid var(--btn-borda);
  border-radius: var(--r-md);
  box-shadow: 0 var(--btn-curso) 0 var(--btn-base);
  transition: transform 70ms ease-out, box-shadow 70ms ease-out, background var(--rapido);
  user-select: none;
}
a.btn:hover { text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(var(--btn-curso)); box-shadow: 0 0 0 var(--btn-base); }

  --btn-fundo: var(--superficie-3);
  --btn-texto: var(--texto-2);
  --btn-borda: var(--superficie-3);
  cursor: not-allowed;
  box-shadow: none;
  transform: translateY(var(--btn-curso));
}
.btn svg { width: 20px; height: 20px; flex: none; }

.btn--bloco { display: flex; width: 100%; }
.btn--contorno {
  --btn-fundo: var(--fundo);
  --btn-texto: var(--texto);
  --btn-borda: var(--linha);
  --btn-base: var(--linha);
}

  --btn-fundo: var(--tinta);
  --btn-texto: var(--tinta-contraste);

}

  --btn-texto: #000;
  --btn-borda: #000;
  --btn-base: #000;
}
.btn--fantasma {
  --btn-fundo: transparent;
  --btn-texto: var(--texto);
  --btn-borda: transparent;
  --btn-curso: 0px;
  box-shadow: none;
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 4px;
}
.btn--fantasma:hover:not(:disabled) { background: var(--superficie-2); }
.btn--fantasma:active:not(:disabled) { transform: scale(.97); }
.btn--suave {
  --btn-fundo: var(--marca-suave);
  --btn-texto: var(--marca-forte);
  --btn-borda: var(--marca-suave);
  --btn-curso: 0px;
  box-shadow: none;
}
.btn--suave:active:not(:disabled) { transform: scale(.97); }
.btn--perigo { --btn-fundo: var(--erro-fundo); --btn-texto: #fff; --btn-borda: var(--marca-base); --btn-base: var(--marca-base); }
.btn--sucesso { --btn-fundo: #15803d; --btn-texto: #fff; --btn-borda: var(--marca-base); --btn-base: var(--marca-base); }
.btn--pequeno { min-height: 42px; padding: 0 var(--e4); font-size: var(--t-sm); --btn-curso: 2px; border-radius: 10px; }
.btn--grande { min-height: 56px; font-size: var(--t-lg); --btn-curso: 4px; }
.btn--icone { padding: 0; width: 46px; min-height: 46px; }

.btn--carregando { color: transparent !important; position: relative; pointer-events: none; }
.btn--carregando::before {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  border: 2.5px solid color-mix(in srgb, var(--btn-texto) 35%, transparent);
  border-top-color: var(--btn-texto);
  border-radius: 50%;
  animation: girar .7s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }

.acoes-fixas {
  position: sticky;
  bottom: calc(var(--abas-altura, 0px) + var(--teclado, 0px));
  z-index: 5;
  display: flex;
  gap: var(--e3);
  padding: var(--e3) 0 var(--e2);
  margin-top: var(--e6);
  background: var(--fundo);
  border-top: 1.5px solid var(--linha);
}
.acoes-fixas .btn { flex: 1; }
.acoes-fixas:empty { display: none; }

.campo { display: block; }
.campo + .campo { margin-top: var(--e4); }
.campo__rotulo {
  display: block;
  font-size: var(--t-sm);
  font-weight: 700;
  color: var(--texto);
  margin-bottom: 6px;
}
.campo__opcional { font-weight: 500; color: var(--texto-3); }

.entrada {
  width: 100%;
  min-height: 52px;
  padding: var(--e3) var(--e4);
  background: var(--fundo);
  border: 1.5px solid var(--borda-forte);
  border-radius: var(--r-md);
  color: var(--texto);
  transition: border-color var(--rapido), box-shadow var(--rapido);
}
.entrada::placeholder { color: var(--texto-3); }
.entrada:hover:not(:disabled) { border-color: var(--tinta); }
.entrada:focus {
  border-color: var(--tinta);
  box-shadow: 3px 3px 0 var(--marca);
}
.entrada:disabled { background: var(--superficie-2); color: var(--texto-3); border-color: var(--borda); cursor: not-allowed; }
textarea.entrada { min-height: 112px; resize: vertical; line-height: 1.5; }
select.entrada {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--texto) 50%),
                    linear-gradient(135deg, var(--texto) 50%, transparent 50%);
  background-position: calc(100% - 21px) 23px, calc(100% - 15px) 23px;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  padding-right: var(--e8);
}

.campo--erro .entrada { border-color: var(--erro); }
.campo--erro .entrada:focus { box-shadow: 3px 3px 0 var(--erro); }
.campo__erro {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 6px;
  font-size: var(--t-sm);
  color: var(--erro);
  font-weight: 600;
}
.campo__ajuda { margin-top: 6px; font-size: var(--t-sm); color: var(--texto-3); }

.entrada-grupo { position: relative; display: flex; align-items: center; }
.entrada-grupo .entrada { padding-left: 46px; }
.entrada-grupo__icone {
  position: absolute;
  left: var(--e4);
  color: var(--texto-2);
  pointer-events: none;
}
.entrada-grupo__icone svg { width: 20px; height: 20px; }
.entrada-grupo__acao {
  position: absolute;
  right: 5px;
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--texto-2);
}
.entrada-grupo__acao:hover { background: var(--superficie-2); }
.entrada-grupo--acao .entrada { padding-right: 52px; }

.forca { display: flex; gap: 4px; margin-top: var(--e2); }
.forca__barra {
  height: 5px; flex: 1;
  background: var(--superficie-3);
  border-radius: var(--r-full);
  transition: background var(--normal);
}
.forca__barra--on { background: var(--nivel-cor, var(--sucesso)); }
.forca__texto { margin-top: 5px; font-size: var(--t-xs); color: var(--texto-3); }

.opcao {
  display: flex;
  align-items: center;
  gap: var(--e3);
  min-height: 56px;
  padding: var(--e3) var(--e4);
  background: var(--ladrilho);
  border: 1.5px solid transparent;
  border-radius: 18px;
  cursor: pointer;
  transition: border-color var(--rapido), background var(--rapido), box-shadow var(--rapido);
}
.opcao:hover { border-color: color-mix(in srgb, var(--texto) 25%, transparent); }
.opcao input { position: absolute; opacity: 0; pointer-events: none; }
.opcao__marca {
  flex: none;
  width: 24px; height: 24px;
  border: 1.5px solid var(--tinta);
  border-radius: 7px;
  display: grid; place-items: center;
  background: var(--fundo);
  transition: background var(--rapido);
}
.opcao--radio .opcao__marca { border-radius: 50%; }
.opcao__marca::after {
  content: '';
  width: 12px; height: 7px;
  margin-top: -3px;
  border-left: 2.5px solid #fff;
  border-bottom: 2.5px solid #fff;
  transform: rotate(-45deg) scale(0);
  transition: transform var(--rapido);
}
.opcao--radio .opcao__marca::after {
  width: 10px; height: 10px; margin: 0;
  border: 0; border-radius: 50%; background: #fff;
  transform: scale(0);
}
.opcao:has(input:checked) { border-color: var(--marca); background: var(--marca-suave); box-shadow: 0 0 0 1px var(--marca); }
.opcao:has(input:checked) .opcao__marca { background: var(--marca); border-color: var(--marca); }
.opcao:has(input:checked) .opcao__marca::after { transform: rotate(-45deg) scale(1); }
.opcao--radio:has(input:checked) .opcao__marca::after { transform: scale(1); }
.opcao:has(input:focus-visible) { outline: 3px solid var(--destaque); outline-offset: 2px; }
.opcao__texto { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.opcao__titulo { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.opcao__resumo { font-size: var(--t-sm); color: var(--texto-2); overflow-wrap: anywhere; }
.opcao__valor { font-weight: 800; font-variant-numeric: tabular-nums; }

.interruptor {
  position: relative;
  flex: none;
  width: 54px; height: 32px;
  border-radius: var(--r-full);
  background: var(--fundo);
  border: 1.5px solid var(--tinta);
  transition: background var(--normal);
}
.interruptor::before {
  content: '';
  position: absolute;
  inset: -8px -4px;
}
.interruptor::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 23px; height: 23px;
  border-radius: 50%;
  background: var(--tinta);
  transition: transform var(--normal), background var(--normal);
}
.interruptor[aria-checked='true'] { background: var(--marca); border-color: var(--marca); }
.interruptor[aria-checked='true']::after { transform: translateX(22px); background: #fff; }

.fichas { display: flex; flex-wrap: wrap; gap: var(--e2); }
.ficha {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 42px;
  padding: 0 var(--e4);
  font-size: var(--t-sm);
  font-weight: 700;
  color: var(--texto);
  background: var(--fundo);
  border: 1.5px solid var(--borda-forte);
  border-radius: var(--r-full);
  transition: background var(--rapido), color var(--rapido), border-color var(--rapido);
  white-space: nowrap;
}
.ficha:hover { border-color: var(--tinta); }
.ficha[aria-pressed='true'] {
  color: #fff;
  background: var(--marca);
  border-color: var(--marca);
}
.ficha svg { width: 17px; height: 17px; }
span.ficha { min-height: 34px; border-style: dashed; font-weight: 600; }
span.ficha[aria-pressed='true'] { border-style: solid; }

.fichas--passos { flex-wrap: nowrap; gap: 6px; }
.fichas--passos .ficha { min-height: 36px; padding: 0 12px; font-size: .8rem; flex: 0 1 auto; min-width: 0; }
.fichas--passos .ficha:disabled { color: var(--texto-3); border-style: dashed; }

.fichas--rolagem {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
  margin-inline: calc(var(--e5) * -1);
  padding-inline: var(--e5);
  scroll-snap-type: x proximity;
}
.fichas--rolagem::-webkit-scrollbar { display: none; }
.fichas--rolagem > * { scroll-snap-align: start; }

.etiqueta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  padding: 3px 10px;
  font-size: var(--t-xs);
  font-weight: 800;
  border-radius: var(--r-full);
  background: var(--superficie-2);
  color: var(--texto);
  white-space: nowrap;
}
.etiqueta::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.etiqueta--sem-ponto::before { display: none; }
.etiqueta--sucesso { background: var(--sucesso-suave); color: var(--sucesso); }
.etiqueta--info { background: var(--info-suave); color: var(--info); }
.etiqueta--marca { background: var(--marca); color: #fff; }
.etiqueta--erro { background: var(--erro-suave); color: var(--erro); }
.etiqueta--alerta { background: var(--destaque); color: #000; }
.etiqueta--vivo::before { box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }

.selo-novo, .selo-fixo {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: none;
  padding: 2px 8px;
  font-size: .68rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  white-space: nowrap;
  color: #000;
  background: var(--destaque);
  border-radius: 6px;
}
.selo-fixo { background: var(--marca-suave); color: var(--marca-forte); }
.selo-fixo svg, .selo-novo svg { width: 12px; height: 12px; }

.avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--destaque);
  color: #000;
  border: 1.5px solid var(--linha);
  font-weight: 800;
  font-size: var(--t-md);
  letter-spacing: -0.02em;
  position: relative;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.avatar > svg { width: 48%; height: 48%; }
.avatar--gg { width: 84px; height: 84px; font-size: 1.7rem; box-shadow: 4px 4px 0 var(--marca); }
.avatar--g { width: 60px; height: 60px; font-size: var(--t-xl); }
.avatar--p { width: 34px; height: 34px; font-size: var(--t-xs); }
.avatar__selo {
  position: absolute;
  right: -3px; bottom: -3px;
  width: 20px; height: 20px;
  display: grid; place-items: center;
  background: var(--marca);
  color: #fff;
  border: 2px solid var(--fundo);
  border-radius: 50%;
}
.avatar__selo svg { width: 11px; height: 11px; stroke-width: 3.5; }
.avatar--marca { background: var(--marca); color: #fff; }

.estrelas { display: inline-flex; align-items: center; gap: 1px; }
.estrelas svg { width: 16px; height: 16px; fill: var(--destaque); stroke: var(--estrela-fio); stroke-width: 1.6; }
.estrelas svg.estrelas__vazia { fill: none; stroke: var(--borda-forte); }
.estrelas--g svg { width: 30px; height: 30px; }
.nota { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; }

.estrelas-entrada { display: flex; gap: var(--e1); justify-content: center; }
.estrelas-entrada button {
  display: grid; place-items: center;
  width: 54px; height: 54px;
  color: var(--borda-forte);
  transition: transform var(--rapido);
}
.estrelas-entrada button svg { width: 42px; height: 42px; stroke-width: 1.5; }
.estrelas-entrada button:active { transform: scale(1.18); }
.estrelas-entrada button[data-ativa='true'] svg { fill: var(--destaque); stroke: var(--estrela-fio); }

.lista { display: flex; flex-direction: column; gap: var(--e3); }
.lista:has(> .item) {
  gap: 0;
  background: var(--ladrilho);
  border-radius: 20px;
  overflow: hidden;
}
.lista > .item { border: 0; border-radius: 0; background: transparent; }
.lista > .item + .item { border-top: 1px solid color-mix(in srgb, var(--texto) 9%, transparent); }

.item {
  display: flex;
  align-items: center;
  gap: var(--e3);
  width: 100%;
  min-height: 64px;
  padding: var(--e3) var(--e4);
  background: var(--ladrilho);
  border: 1px solid transparent;
  border-radius: 20px;
  color: var(--texto);
  text-align: left;
  transition: background var(--rapido);
}
button.item, a.item { border-color: transparent; }
.lista > button.item, .lista > a.item { border-width: 0; }
.lista > button.item + .item, .lista > a.item + .item,
.lista > .item + button.item { border-top: 1px solid color-mix(in srgb, var(--texto) 9%, transparent); }
@media (hover: hover) { button.item:hover, a.item:hover { background: color-mix(in srgb, var(--texto) 5%, var(--ladrilho)); text-decoration: none; } }
button.item:active { background: color-mix(in srgb, var(--texto) 8%, var(--ladrilho)); }
.item__icone {
  flex: none;
  display: grid; place-items: center;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--fundo);
  color: var(--texto);
}
.item__icone svg { width: 21px; height: 21px; }
.item__icone--marca { background: var(--marca); border-color: var(--marca); color: #fff; }
.item__icone--amarelo { background: var(--destaque); border-color: #000; color: #000; }
.item__corpo {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.item__titulo {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.item__resumo {
  font-size: var(--t-sm);
  color: var(--texto-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.item__fim { flex: none; text-align: right; color: var(--texto-2); font-size: var(--t-sm); }
.item__seta { color: var(--texto); }
.item__seta svg { width: 19px; height: 19px; }
.item > svg:last-child { flex: none; width: 19px; height: 19px; }

.estado-vazio {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--e3);
  padding: var(--e8) var(--e5);
  color: var(--texto-2);
}
.estado-vazio__icone {
  display: grid; place-items: center;
  width: 76px; height: 76px;
  border-radius: 50%;
  background: var(--destaque);
  border: 1.5px solid var(--linha);
  color: #000;
}
.estado-vazio__icone svg { width: 34px; height: 34px; }
.estado-vazio__desenho { color: var(--marca); margin-bottom: var(--e2); }
.ilustracao { width: 124px; height: 118px; }
.estado-vazio h2 { font-size: var(--t-xl); color: var(--texto); }
.estado-vazio p { max-width: 32ch; }
.erro-detalhe {
  max-width: 100%;
  overflow-x: auto;
  padding: var(--e3);
  font-family: var(--fonte-num);
  font-size: var(--t-xs);
  text-align: left;
  background: var(--superficie-2);
  border-radius: var(--r-sm);
  color: var(--erro);
}

.esqueleto {
  background: linear-gradient(90deg, var(--superficie-2) 25%, var(--superficie-3) 50%, var(--superficie-2) 75%);
  background-size: 200% 100%;
  animation: brilho 1.4s ease-in-out infinite;
  border-radius: var(--r-sm);
}
@keyframes brilho { to { background-position: -200% 0; } }
.marca-carregando { width: 72px; height: 72px; border-radius: 20px; }

.cortina {
  position: fixed;
  inset: 0;
  z-index: var(--z-folha);
  background: var(--cortina);
  animation: aparecer var(--normal) both;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
@keyframes aparecer { from { opacity: 0; } }

.folha {
  width: min(100%, var(--largura-folha));
  max-height: 90dvh;
  overflow-y: auto;
  padding: var(--e5);
  padding-bottom: calc(var(--e6) + var(--seguro-base));
  background: var(--fundo);
  border: 1.5px solid var(--linha);
  border-bottom: 0;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  animation: subir var(--suave) both;
}
@keyframes subir { from { transform: translateY(100%); } }
.folha__punho {
  width: 44px; height: 5px;
  margin: -6px auto var(--e4);
  background: var(--tinta);
  border-radius: var(--r-full);
}
.folha__titulo { margin-bottom: var(--e2); font-size: var(--t-xl); }

.modal {
  width: min(100% - 32px, 440px);
  margin: auto;
  padding: var(--e6);
  background: var(--fundo);
  border: 1.5px solid var(--linha);
  border-radius: var(--r-xl);
  box-shadow: 6px 6px 0 var(--marca);
  animation: pipocar var(--normal) both;
}
.cortina--centro { align-items: center; }
@keyframes pipocar { from { transform: scale(.94); opacity: 0; } }

.avisos {
  position: fixed;
  left: 0; right: 0;
  margin-inline: auto;
  bottom: calc(var(--abas-altura, 0px) + var(--e4));
  z-index: var(--z-aviso);
  width: min(100% - 32px, 480px);
  display: flex;
  flex-direction: column;
  gap: var(--e2);
  pointer-events: none;
}
.aviso {
  display: flex;
  align-items: center;
  gap: var(--e3);
  padding: var(--e3) var(--e4);
  min-height: 52px;
  background: var(--tinta);
  color: var(--tinta-contraste);
  border-radius: var(--r-md);
  font-size: var(--t-sm);
  font-weight: 600;
  pointer-events: auto;
  animation: avisoEntra var(--suave) both;
}
.aviso--saindo { animation: avisoSai var(--normal) both; }
@keyframes avisoEntra { from { transform: translateY(16px) scale(.96); opacity: 0; } }
@keyframes avisoSai { to { transform: translateY(8px); opacity: 0; } }
.aviso--sucesso svg { color: var(--sucesso-aviso); }
.aviso--erro svg { color: var(--erro-aviso); }
.aviso--alerta svg { color: var(--alerta-aviso); }
.aviso svg { width: 20px; height: 20px; flex: none; }
.aviso__texto { flex: 1; }

.trilha {
  height: 8px;
  background: var(--superficie-3);
  border-radius: var(--r-full);
  overflow: hidden;
}
.trilha__barra {
  height: 100%;
  background: var(--marca);
  border-radius: var(--r-full);
  transition: width var(--suave);
}

.passos { display: flex; flex-direction: column; gap: 0; }
.passo {
  display: flex;
  gap: var(--e3);
  padding-bottom: var(--e5);
  position: relative;
}
.passo:last-child { padding-bottom: 0; }
.passo::before {
  content: '';
  position: absolute;
  left: 12px; top: 26px; bottom: 0;
  width: 2px;
  background: var(--borda);
}
.passo:last-child::before { display: none; }
.passo__bolinha {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--fundo);
  border: 1.5px solid var(--borda-forte);
  color: var(--texto-3);
  z-index: 1;
}
.passo__bolinha svg { width: 13px; height: 13px; stroke-width: 3; }
.passo--feito .passo__bolinha { background: var(--tinta); border-color: var(--tinta); color: var(--tinta-contraste); }
.passo--feito::before { background: var(--tinta); }
.passo--atual .passo__bolinha {
  background: var(--destaque); border-color: var(--linha); color: #000;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--destaque) 35%, transparent);
}
.passo__corpo { flex: 1; padding-top: 2px; }
.passo__titulo { font-weight: 700; }
.passo--pendente .passo__titulo { color: var(--texto-3); font-weight: 600; }
.passo__quando { font-size: var(--t-sm); color: var(--texto-2); }

.destaque {
  display: flex;
  gap: var(--e3);
  padding: var(--e3) var(--e4);

.destaque svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--info); }

.destaque--alerta { background: var(--destaque-suave); }

.destaque--erro { background: var(--erro-suave); }
.destaque--erro svg { color: var(--erro); }
.destaque strong { font-weight: 800; }

.valor-grande {
  font-family: var(--fonte-display);
  font-size: var(--t-3xl);
  font-weight: 800;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
}
.valor-medio {
  font-family: var(--fonte-display);
  font-size: var(--t-xl);
  font-weight: 800;

}

.resumo-linha {

.resumo-linha__valor { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }

.calendario { display: block; }
.calendario__cabecalho {

  align-items: center;

  gap: var(--e2);
  margin-bottom: var(--e3);
}
.calendario__mes { font-family: var(--fonte-display); font-weight: 800; font-size: var(--t-lg); letter-spacing: -0.02em; }
.calendario__mes::first-letter { text-transform: uppercase; }
.calendario__semana,
.calendario__grade {

  gap: 4px;
}
.calendario__semana div {
  text-align: center;
  font-size: var(--t-xs);
  font-weight: 800;

}
.dia {
  position: relative;
  aspect-ratio: 1;
  max-height: 64px;

  flex-direction: column;

}

.dia--fora { color: var(--texto-3); opacity: .5; }
.dia--hoje { background: var(--destaque); color: #000; font-weight: 800; border-color: var(--linha); }

.dia--escolhido, .dia--escolhido:hover { background: var(--marca); color: #fff; border-color: var(--marca); font-weight: 800; }
.dia__pontos { display: flex; gap: 2px; height: 5px; }
.dia__ponto { width: 5px; height: 5px; border-radius: 50%; background: var(--marca); }
.dia--hoje .dia__ponto { background: #000; }
.dia--escolhido .dia__ponto { background: #fff; }

.grafico { display: flex; align-items: flex-end; gap: 4px; height: 96px; }
.grafico__coluna {

  justify-content: flex-end;
  height: 100%;

}
.grafico__barra {

}
.grafico__coluna--hoje .grafico__barra { background: var(--destaque); box-shadow: inset 0 0 0 1.5px var(--linha); }
.grafico__legenda {
  display: flex;
  justify-content: space-between;
  margin-top: var(--e2);
  padding-top: var(--e2);
  border-top: 1.5px solid var(--tinta);
  font-size: var(--t-xs);
  color: var(--texto-2);
}

.barras { display: grid; gap: var(--e4); }
.barras__trilha { height: 10px; border-radius: var(--r-full); background: var(--superficie-3); margin-top: 6px; overflow: hidden; }
.barras__barra { height: 100%; border-radius: var(--r-full); background: var(--marca); }
.barras__linha:first-child .barras__barra { background: var(--destaque); box-shadow: inset 0 0 0 1.5px var(--linha); }

.chat {

  gap: var(--e2);

}
.balao {

}
.chat__barra {

.chat__barra textarea {

}

.galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e2); }
.galeria__item {
  position: relative;
  aspect-ratio: 1;

}

.galeria__remover {

}
.galeria__remover svg { width: 14px; height: 14px; }
.galeria__adicionar {
  display: grid;
  place-items: center;

  border: 1.5px dashed var(--tinta);

  color: var(--texto);

}

.visor {

.busca { position: relative; }

}
.busca__icone svg { width: 20px; height: 20px; }

.entra-1 { animation-delay: 40ms; }
.entra-2 { animation-delay: 80ms; }
.entra-3 { animation-delay: 120ms; }

.divisor { height: 1px; background: var(--borda); margin: var(--e4) 0; }
.divisor--texto {

  margin: var(--e5) 0;
}
.divisor--texto::before, .divisor--texto::after {

}

.codigo {

  font-family: var(--fonte-num);
  font-size: var(--t-2xl);
  font-weight: 700;
}
.codigo span {
  display: grid; place-items: center;

  background: var(--destaque);
  color: #000;

}

details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }

.pular-para-conteudo {

}
.pular-para-conteudo:focus { top: 0; text-decoration: none; }

.faixa-offline {

}

.puxar {

}
.puxar__roda {

}
.puxar--pronto .puxar__roda { animation: girar .7s linear infinite; }


.saudacao__ola { font-size: var(--t-md); color: var(--texto-2); font-weight: 600; }
.saudacao__nome {

  line-height: 1.05;
}

.painel-marca {

}
.painel-marca .texto-2, .painel-marca .t-sm { color: var(--painel-texto); opacity: .9; }
.painel-marca--toque { font: inherit; cursor: pointer; transition: transform 80ms ease-out, box-shadow 80ms ease-out; }
.painel-marca--toque:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--painel-sombra); }
.painel-marca--toque:focus-visible { outline: 3px solid var(--tinta); outline-offset: 4px; }
.painel-marca__dica { opacity: .95; font-weight: 600; }
.painel-marca svg { flex: none; }

.painel-marca .btn--suave, .painel-marca .btn--contorno {

}

.heroi { display: grid; gap: 4px; justify-items: start; }
.heroi__rotulo {

}

}
.heroi__valor {
  font-family: var(--fonte-display);
  font-size: clamp(2.3rem, 11vw, 3rem);

  letter-spacing: -0.045em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.heroi__valor--texto {

}
.heroi__apoio { font-size: var(--t-md); opacity: .95; }
.heroi > .etapas, .heroi > .sparkline, .heroi__acao { justify-self: stretch; }

.etapas { display: flex; gap: 5px; margin-top: var(--e4); }
.etapas__passo {

  flex: 1;
  border-radius: 999px;

}
.etapas__passo--feito { background: var(--painel-texto, var(--texto)); }
.etapas__passo--atual { background: var(--painel-acento, var(--destaque)); }

.sparkline {
  position: relative;
  margin-top: var(--e3);
  padding-right: 7px;
}
.sparkline__svg { width: 100%; height: 100%; display: block; overflow: visible; }

.sparkline__ponta {

}

.meta {
  display: grid;
  gap: var(--e2);
  width: 100%;
  text-align: left;
  padding: var(--e4);
  background: var(--fundo);
  border: 1px solid var(--borda);
  border-radius: var(--r-lg);

}
.meta--clicavel { border: 1.5px solid var(--linha); }
.meta--clicavel:active { background: var(--superficie-2); }
.meta__rotulo {
  font-size: var(--t-xs); font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--texto-3);
}
.meta__pct { font-weight: 800; font-size: var(--t-lg); letter-spacing: -0.02em; }
.meta__trilha {

}
.meta__barra { height: 100%; background: var(--marca); transition: width var(--suave); }
.meta__barra--bateu { background: var(--destaque); }
.meta__nota { font-size: var(--t-sm); color: var(--texto-2); }

.semana {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.semana__dia {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: var(--e2) 0 6px;
  border-radius: var(--r-md);
  color: var(--texto);
  transition: background var(--rapido);
}
.semana__dia:hover { background: var(--superficie-2); }
.semana__letra { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-3); }
.semana__numero {

}
.semana__pontos { display: flex; gap: 3px; height: 6px; }
.semana__ponto { width: 6px; height: 6px; border-radius: 50%; background: var(--marca); }
.semana__dia--hoje .semana__numero { background: var(--destaque); color: #000; border-color: var(--linha); font-weight: 800; }
.semana__dia--hoje .semana__letra { color: var(--texto); }
.semana__dia--escolhido .semana__numero { background: var(--marca); color: #fff; border-color: var(--marca); font-weight: 800; }
.semana__dia--escolhido.semana__dia--hoje .semana__numero { box-shadow: 0 0 0 2.5px var(--destaque); }

.dia-trilho { list-style: none; margin: 0; padding: 0; }
.dia-trilho__item { position: relative; }
.dia-trilho__item + .dia-trilho__item { border-top: 1px solid var(--borda); }
.dia-trilho__toque {
  display: grid;
  grid-template-columns: 56px 16px 1fr auto;
  align-items: center;
  gap: var(--e3);
  width: 100%;
  min-height: 64px;
  padding: var(--e2) 0;
  text-align: left;
  color: var(--texto);
}
.dia-trilho__toque:active { background: var(--superficie-2); }
.dia-trilho__toque svg { width: 19px; height: 19px; }
.dia-trilho__hora { display: grid; justify-items: end; line-height: 1.15; }
.dia-trilho__hora .num { font-family: var(--fonte-display); font-weight: 800; font-size: var(--t-lg); letter-spacing: -0.03em; }
.dia-trilho__duracao { font-size: var(--t-xs); color: var(--texto-3); font-weight: 600; }
.dia-trilho__marca {
  justify-self: center;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--marca);
  border: 1.5px solid var(--linha);
}
.dia-trilho__corpo { display: grid; min-width: 0; }
.dia-trilho__titulo { font-weight: 700; }
.dia-trilho__resumo { font-size: var(--t-sm); color: var(--texto-2); }
.dia-trilho__fim { font-weight: 800; font-variant-numeric: tabular-nums; }

.indicadores {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--e2);
}
.indicador {
  display: grid;
  justify-items: start;
  gap: 0;
  padding: var(--e4) var(--e3);
  text-align: left;
  min-width: 0;
}
.indicador { align-content: end; min-height: 92px; padding: var(--e3); border-radius: 20px; background: var(--destaque); color: #000; }
.indicador:nth-child(2) { background: var(--marca); color: #fff; }
.indicador:nth-child(3) { background: var(--tinta); color: var(--tinta-contraste); }
.indicador .indicador__rotulo { color: inherit; opacity: .85; font-weight: 700; font-size: .74rem; }
.indicador__icone { display: none; }
.indicador__valor {
  font-family: var(--fonte-display);
  font-size: clamp(1rem, 4.8vw, 1.4rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.indicador__rotulo { font-size: var(--t-sm); color: var(--texto-2); }

.reputacao {
  display: grid;
  justify-items: end;
  gap: 1px;
  padding: var(--e1) var(--e2);
  border-radius: var(--r-sm);
  color: var(--texto);
}
.reputacao:active { background: var(--superficie-2); }

.servicos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e3) var(--e2); }
.servico {
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 6px;
  padding: 0;
  text-align: center;
  font: inherit;
  color: var(--texto);
  background: none;
  border: 0;
  cursor: pointer;
}
.servico__icone {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1.12;
  max-height: 80px;
  color: var(--marca-forte);
  background: var(--ladrilho);
  border-radius: 18px;
  transition: transform 90ms ease-out;
}
.servico:active .servico__icone { transform: scale(.93); }
.servico__icone .arte { width: 60%; height: auto; max-width: 60px; transition: transform 260ms cubic-bezier(.2, 1.5, .4, 1); }
@media (hover: hover) { .servico:hover .servico__icone .arte { transform: rotate(-7deg) scale(1.1); } }
.servico__selo {
  position: absolute;
  top: -7px; left: 50%;

  padding: 2px 8px;
  border-radius: var(--r-full);
  background: var(--promo);
  color: #fff;
  font-size: .62rem;
  font-weight: 800;
  letter-spacing: .03em;
  text-transform: uppercase;
  white-space: nowrap;
}
.servico__icone svg { width: 28px; height: 28px; stroke-width: 1.7; }
.servico__texto { display: grid; }
.servico__nome { font-size: .78rem; font-weight: 700; line-height: 1.2; }

.atalhos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e2); }
.atalho {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: var(--e2) 2px;
  color: var(--texto);
  font-size: var(--t-xs);
  font-weight: 700;
  text-align: center;
  line-height: 1.15;
  border-radius: var(--r-md);
}
.atalho__icone {
  position: relative;
  display: grid; place-items: center;
  width: 54px; height: 54px;
  border-radius: 50%;
  background: var(--ladrilho);
  transition: transform 90ms ease-out, background var(--rapido);

.regras { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  display: grid;

.cartao--ladrilho { background: var(--ladrilho); border-color: transparent; box-shadow: none; }
.cartao--ladrilho.cartao--clicavel:active { transform: scale(.985); box-shadow: none; }

.busca .entrada { min-height: 52px; border-color: transparent; border-radius: var(--r-full); background: var(--ladrilho); font-weight: 600; }

.cabeca-perfil::before { width: 170px; height: 170px; left: -60px; top: -60px; }

.cabeca-perfil__foto { position: relative; padding: 0; border: 0; background: none; cursor: pointer; margin-bottom: var(--e2); }

.cabeca-perfil__camera {

.minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e2); }
.mini {
  display: grid;
  align-content: end;
  gap: 2px;

  padding: var(--e3);

}

.linha > .btn--fantasma { flex: none; white-space: nowrap; }

.plantao { border-color: transparent !important; background: var(--ladrilho); border-radius: 20px; }
.plantao--ligado { background: color-mix(in srgb, var(--sucesso) 14%, var(--ladrilho)); }

.lista:has(> .opcao) { background: none; gap: var(--e2); overflow: visible; }


@keyframes dx-surgir {
  from { opacity: 0; transform: translate3d(0, 10px, 0); }
  to   { opacity: 1; transform: none; }
}
@keyframes dx-surgir-lado {
  from { opacity: 0; transform: translate3d(16px, 0, 0); }
  to   { opacity: 1; transform: none; }
}
@keyframes dx-crescer {
  from { opacity: 0; transform: scale(.94); }
  to   { opacity: 1; transform: none; }
}

.entra { animation: dx-surgir var(--suave) both; }

.cascata > * {
  animation: dx-surgir 340ms cubic-bezier(.16, 1, .3, 1) both;
  animation-delay: calc(min(var(--i, 0), 8) * 45ms);
}

.tela-entra-avanca { animation: dx-entra-direita 260ms cubic-bezier(.16, 1, .3, 1) both; }
.tela-entra-volta  { animation: dx-entra-esquerda 260ms cubic-bezier(.16, 1, .3, 1) both; }
.tela-entra-troca  { animation: dx-surgir 220ms cubic-bezier(.16, 1, .3, 1) both; }

@keyframes dx-entra-direita {
  from { opacity: 0; transform: translate3d(22px, 0, 0); }
  to   { opacity: 1; transform: none; }
}
@keyframes dx-entra-esquerda {
  from { opacity: 0; transform: translate3d(-22px, 0, 0); }
  to   { opacity: 1; transform: none; }
}

.btn, .item, .cartao--clicavel, .ficha, .aba, .dia, .opcao {
  position: relative;
  overflow: hidden;
}
.btn::after, .item::after, .cartao--clicavel::after,
.ficha::after, .aba::after, .dia::after, .opcao::after {
  content: '';
  position: absolute;
  left: var(--toque-x, 50%);
  top: var(--toque-y, 50%);
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0;
  pointer-events: none;
  transform: scale(0);
}
.tocou::after { animation: dx-onda 480ms cubic-bezier(.2, .6, .3, 1); }

@keyframes dx-onda {
  0%   { opacity: .22; transform: scale(0); }
  100% { opacity: 0;   transform: scale(28); }
}

.aba[aria-current='page'] .aba__icone { animation: dx-pulinho 320ms cubic-bezier(.2, 1.4, .4, 1); }
@keyframes dx-pulinho {

}

.etiqueta--vivo::before { animation: dx-pulso 2s ease-in-out infinite; }
@keyframes dx-pulso {
  0%, 100% { opacity: 1; transform: scale(1); }

}

.marcador, .aba__marcador { animation: dx-crescer 260ms cubic-bezier(.2, 1.4, .4, 1) both; }

.trilha__barra--vivo {
  background-image: linear-gradient(
    100deg,
    transparent 20%,
    color-mix(in srgb, #fff 55%, transparent) 40%,
    transparent 60%
  );
  background-size: 220% 100%;
  animation: dx-varrer 1.8s linear infinite;
}
@keyframes dx-varrer {
  from { background-position: 120% 0; }
  to   { background-position: -60% 0; }
}

.confirmacao { display: grid; place-items: center; }
.confirmacao__circulo {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--sucesso) 14%, transparent);
  display: grid;
  place-items: center;
  animation: dx-crescer 320ms cubic-bezier(.2, 1.4, .4, 1) both;
}
.confirmacao__circulo svg { width: 40px; height: 40px; color: var(--sucesso); stroke-width: 3; }

  stroke-dashoffset: 40;

}
@keyframes dx-riscar { to { stroke-dashoffset: 0; } }

.folha--arrastando { transition: none; }
.folha--voltando { transition: transform 220ms cubic-bezier(.16, 1, .3, 1); }

.chegou { animation: dx-surgir 240ms ease-out both; }


.conteudo[data-chegando] > * > :not(.acoes-fixas) {
  animation: dx-surgir 380ms cubic-bezier(.16, 1, .3, 1) both;
}
.conteudo[data-chegando] > * > .duas-colunas { animation: none; }
.conteudo[data-chegando] .duas-colunas > * > :not(.acoes-fixas) {
  animation: dx-surgir 380ms cubic-bezier(.16, 1, .3, 1) both;
}
.conteudo[data-chegando] > * > :has(.acoes-fixas) { animation: none; }
.conteudo[data-chegando] > * > :nth-child(2),
.conteudo[data-chegando] .duas-colunas > * > :nth-child(1) { animation-delay: 45ms; }
.conteudo[data-chegando] > * > :nth-child(3),
.conteudo[data-chegando] .duas-colunas > * > :nth-child(2) { animation-delay: 90ms; }
.conteudo[data-chegando] > * > :nth-child(4),
.conteudo[data-chegando] .duas-colunas > * > :nth-child(3) { animation-delay: 135ms; }
.conteudo[data-chegando] > * > :nth-child(5),
.conteudo[data-chegando] .duas-colunas > * > :nth-child(4) { animation-delay: 180ms; }
.conteudo[data-chegando] > * > :nth-child(6),
.conteudo[data-chegando] .duas-colunas > * > :nth-child(5) { animation-delay: 220ms; }
.conteudo[data-chegando] > * > :nth-child(n + 7),
.conteudo[data-chegando] .duas-colunas > * > :nth-child(n + 6) { animation-delay: 260ms; }

.conteudo[data-chegando] .grifo { animation: dx-grifo 560ms 200ms cubic-bezier(.65, 0, .25, 1) both; }
@keyframes dx-grifo {
  from { background-size: 0% 100%; }
  to   { background-size: 100% 100%; }
}

.conteudo[data-chegando] .etapas__passo {
  transform-origin: left center;
  animation: dx-encher 420ms cubic-bezier(.3, .9, .3, 1) both;
}
.conteudo[data-chegando] .etapas__passo:nth-child(1) { animation-delay: 240ms; }
.conteudo[data-chegando] .etapas__passo:nth-child(2) { animation-delay: 310ms; }
.conteudo[data-chegando] .etapas__passo:nth-child(3) { animation-delay: 380ms; }
.conteudo[data-chegando] .etapas__passo:nth-child(4) { animation-delay: 450ms; }
.conteudo[data-chegando] .etapas__passo:nth-child(n + 5) { animation-delay: 520ms; }
@keyframes dx-encher {
  from { transform: scaleX(0); }

}
.etapas__passo--atual { animation: dx-respirar 1.8s ease-in-out infinite; }
@keyframes dx-respirar {
  0%, 100% { opacity: 1; }

}

.conteudo[data-chegando] .atalho__icone { animation: dx-carimbo 420ms cubic-bezier(.2, 1.5, .4, 1) both; }
.conteudo[data-chegando] .atalho:nth-child(1) .atalho__icone { animation-delay: 160ms; }
.conteudo[data-chegando] .atalho:nth-child(2) .atalho__icone { animation-delay: 210ms; }
.conteudo[data-chegando] .atalho:nth-child(3) .atalho__icone { animation-delay: 260ms; }
.conteudo[data-chegando] .atalho:nth-child(n + 4) .atalho__icone { animation-delay: 310ms; }

.conteudo[data-chegando] .semana__dia--hoje .semana__numero,
.conteudo[data-chegando] .dia--hoje {
  animation: dx-carimbo 460ms 380ms cubic-bezier(.2, 1.5, .4, 1) both;
}
@keyframes dx-carimbo {
  from { opacity: 0; transform: scale(.4); }
  to   { opacity: 1; transform: none; }
}

.conteudo[data-chegando] .painel-marca__avatar {
  animation: dx-selo 520ms 260ms cubic-bezier(.2, 1.4, .4, 1) both;
}
@keyframes dx-selo {
  from { opacity: 0; transform: scale(.5) rotate(-18deg); }
  to   { opacity: 1; transform: none; }
}

.painel-marca::before, .oferta::before { animation: dx-bolha 6s ease-in-out infinite alternate; }
.painel-marca::after, .oferta::after { animation: dx-bolha 4.5s -2s ease-in-out infinite alternate; }
@keyframes dx-bolha {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-6px, -12px, 0) scale(1.05); }
}

  return { ok: true, pedido: anotar({ ...p, estado: ESTADOS.EM_ANDAMENTO, iniciadoEm: new Date().toISOString() }, 'Check-in confirmado', 'diarista') };
}

function concluir(p) {
  creditarServico({
    diaristaId: p.diaristaId,
    pedidoId: p.id,
    valorLiquido: p.orcamento.repasseProfissional,
    taxa: p.orcamento.taxaPlataforma,
    descricao: `${servicoPorId(p.servicoId)?.nome} - ${p.id.slice(-6)}`,
  });
  notificar(p.clienteId, {
    titulo: 'Serviço concluído',
    mensagem: 'Conte como foi: sua avaliação ajuda outros clientes a escolherem.',
    tipo: 'sucesso',
    link: `#/avaliar/${p.id}`,
  });
  return { ok: true, pedido: anotar({ ...p, estado: ESTADOS.CONCLUIDO, concluidoEm: new Date().toISOString() }, 'Serviço concluído', 'diarista') };
}

function cancelar(p, parte, motivo) {
  const multa = parte === 'cliente' ? calcularMulta(p) : { valor: 0, motivo: 'Cancelado pelo profissional.' };

  if (parte === 'cliente' && multa.valor > 0 && p.diaristaId) {
    creditarMulta({ diaristaId: p.diaristaId, pedidoId: p.id, valor: multa.valor });
  }
  if (p.estado === ESTADOS.CONCLUIDO && p.diaristaId) {
    estornar({ diaristaId: p.diaristaId, pedidoId: p.id, valor: p.orcamento.repasseProfissional, motivo: 'Serviço cancelado após conclusao' });
  }

  const outraParte = parte === 'cliente' ? p.diaristaId : p.clienteId;
  if (outraParte) {
    notificar(outraParte, {
      titulo: 'Pedido cancelado',
      mensagem: parte === 'cliente'
        ? `O cliente cancelou o serviço de ${dataAmigavel(p.dataHora)}.${multa.valor > 0 ? ` Voce recebeu ${dinheiro(multa.valor)} de compensacao.` : ''}`
        : 'O profissional cancelou. Seu pedido voltou para a busca.',
      tipo: 'alerta',
      link: `#/pedido/${p.id}`,
    });
  }

  if (parte === 'diarista') {
    return {
      ok: true,
      pedido: anotar(
        {
          ...p,
          estado: ESTADOS.PROCURANDO,
          diaristaId: null,
          recusadoPor: [...(p.recusadoPor || []), p.diaristaId],
          pagamento: estadoAtual(p.pagamento) === PAGAMENTO.CONFIRMADO
            ? p.pagamento
            : p.pagamento && cobrancaInicial(p.pagamento.metodo),
          diaristaPreferidoId: p.diaristaPreferidoId === p.diaristaId ? null : p.diaristaPreferidoId,
        },
        'Profissional desistiu - pedido republicado',
        'diarista',
      ),
    };
  }

  return {
    ok: true,
    pedido: anotar(
      {
        ...p,
        estado: ESTADOS.CANCELADO,
        canceladoEm: new Date().toISOString(),
        motivoCancelamento: limparParagrafo(motivo, 200),
        multaAplicada: multa.valor,
        pagamento: encerrarCobranca(p.pagamento, { multa: multa.valor }),
      },
      `Cancelado pelo cliente. ${multa.motivo}`,
      'cliente',
    ),
  };
}

function republicar(p) {
  return {
    ok: true,
    pedido: anotar(
      { ...p, estado: ESTADOS.PROCURANDO, expiraEm: somaDias(new Date(), 2).toISOString(), recusadoPor: [] },
      'Publicado novamente',
      'cliente',
    ),
  };
}

function dadosParaRepetir(pedidoId) {
  const { conta } = exigirSessao('cliente');
  const p = todos().find((x) => x.id === pedidoId && x.clienteId === conta.id);
  if (!p) return null;

  const endereco = enderecoPorId(p.enderecoId);
  return {
    servicoId: p.servicoId,
    enderecoId: endereco && !endereco.removido ? p.enderecoId : null,
    tamanhoId: p.tamanhoId,
    periodoId: p.periodoId,
    horas: p.horas,
    extras: [...(p.extras || [])],
    observacoes: p.observacoes,
    diaristaPreferidoId: p.diaristaId || null,
    tarefas: (p.tarefas || []).map((t) => t.texto),
  };
}

function montarTarefas(enviadas, servicoId) {
  const textos = Array.isArray(enviadas) ? enviadas : tarefasSugeridas(servicoId);
  const vistos = new Set();
  const limpas = [];
  for (const cru of textos) {
    const texto = limparLinha(cru, 80);
    const chave = texto.toLowerCase();
    if (!texto || vistos.has(chave)) continue;
    vistos.add(chave);
    limpas.push(texto);
  }
  return limpas.slice(0, MAXIMO_DE_TAREFAS).map((texto, i) => ({ id: `t${i + 1}`, texto, feita: false }));
}

function marcarTarefa(pedidoId, tarefaId, feita = true) {
  const { conta } = exigirSessao('diarista');
  const lista = todos();
  const i = lista.findIndex((p) => p.id === pedidoId && p.diaristaId === conta.id);
  if (i < 0) return { ok: false, erro: 'Serviço não encontrado.' };

  const p = lista[i];
  if (p.estado !== ESTADOS.EM_ANDAMENTO) {
    return { ok: false, erro: 'As tarefas só são marcadas com o serviço em andamento.' };
  }
  if (!(p.tarefas || []).some((t) => t.id === tarefaId)) return { ok: false, erro: 'Tarefa não encontrada.' };

  lista[i] = {
    ...p,
    tarefas: p.tarefas.map((t) =>
      t.id === tarefaId ? { ...t, feita: !!feita, feitaEm: feita ? new Date().toISOString() : null } : t,
    ),
    atualizadoEm: new Date().toISOString(),
  };
  salvarTodos(lista);
  publicar(EVENTOS.PEDIDO_MUDOU, { pedidoId, estado: p.estado });
  return { ok: true, pedido: decorar(lista[i], conta) };
}

const LIMITE_DE_REAGENDAMENTOS = 2;

const DIA_DA_SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];

function reagendar(pedidoId, { data, periodoId, hora: horaPedida } = {}) {
  const { conta } = exigirSessao('cliente');
  const lista = todos();
  const i = lista.findIndex((p) => p.id === pedidoId && p.clienteId === conta.id);
  if (i < 0) return { ok: false, erro: 'Pedido não encontrado.' };
  const p = lista[i];

  if (![ESTADOS.PROCURANDO, ESTADOS.AGENDADO].includes(p.estado)) {
    return { ok: false, erro: 'Só dá para mudar a data antes de o profissional sair de casa.' };
  }
  if ((p.reagendamentos || 0) >= LIMITE_DE_REAGENDAMENTOS) {
    return { ok: false, erro: 'Este pedido já mudou de data duas vezes. Para mudar de novo, cancele e publique outro.' };
  }

  const periodo = periodoPorId(periodoId || p.periodoId);
  const quando = deDataHora(data, horaDeChegadaValida(horaPedida) ? horaPedida : periodo.horaPadrao);
  if (!quando || quando.getTime() < Date.now() + 2 * 3600000) {
    return { ok: false, erro: 'Escolha um horário com pelo menos 2 horas de antecedência.' };
  }
  if (quando.toISOString() === p.dataHora) return { ok: false, erro: 'Essa já é a data marcada.' };

  if (p.diaristaId) {
    const nome = String(contaPorId(p.diaristaId)?.nome || 'O profissional').split(' ')[0];
    const disponibilidade = perfilDe(p.diaristaId)?.disponibilidade || {};
    if (disponibilidade[DIA_DA_SEMANA[quando.getDay()]] === false) {
      return { ok: false, erro: `${nome} não atende nesse dia da semana. Escolha outro dia.` };
    }
    if ((perfilDe(p.diaristaId)?.folgas || []).includes(isoData(quando))) {
      return { ok: false, erro: `${nome} está de folga nesse dia. Escolha outro dia.` };
    }
    const inicio = quando.getTime();
    const fim = inicio + (p.horas || 1) * 3600000;
    const ocupado = lista.some((o) => {
      if (o.id === p.id || o.diaristaId !== p.diaristaId) return false;
      if (![ESTADOS.AGENDADO, ESTADOS.A_CAMINHO, ESTADOS.EM_ANDAMENTO].includes(o.estado)) return false;
      const comeca = new Date(o.dataHora).getTime();
      return comeca < fim && comeca + (o.horas || 1) * 3600000 > inicio;
    });
    if (ocupado) {
      return { ok: false, erro: `${nome} já tem outro serviço nesse horário. Escolha outro dia ou período.` };
    }
  }

  lista[i] = anotar(
    {
      ...p,
      dataHora: quando.toISOString(),
      periodoId: periodo.id,
      reagendamentos: (p.reagendamentos || 0) + 1,
      expiraEm: p.estado === ESTADOS.PROCURANDO ? somaDias(new Date(), 2).toISOString() : p.expiraEm,
    },
    `Reagendado para ${dataAmigavel(quando)} às ${hora(quando)}`,
    'cliente',
  );
  salvarTodos(lista);

  if (p.diaristaId) {
    notificar(p.diaristaId, {
      titulo: 'O cliente mudou a data',
      mensagem: `${servicoPorId(p.servicoId)?.nome} agora é ${dataAmigavel(quando)} às ${hora(quando)}. Se não puder, desista pelo detalhe do serviço.`,
      tipo: 'alerta',
      link: `#/servico/${p.id}`,
    });
  }
  publicar(EVENTOS.PEDIDO_MUDOU, { pedidoId, estado: p.estado });
  return { ok: true, pedido: decorar(lista[i], conta) };
}

const MOTIVOS_DE_PROBLEMA = [
  { id: 'incompleto', nome: 'O serviço ficou incompleto' },
  { id: 'atraso', nome: 'Atrasou ou saiu antes da hora' },
  { id: 'dano', nome: 'Algo foi danificado' },
  { id: 'conduta', nome: 'Comportamento do profissional' },
  { id: 'outro', nome: 'Outro motivo' },
];
const PRAZO_DO_PROBLEMA_HORAS = 48;
const DEVOLUCOES_POSSIVEIS = [0, 25, 50, 100];

const dentroDoPrazoDeProblema = (p) =>
  Date.now() - new Date(p.concluidoEm || p.atualizadoEm).getTime() <= PRAZO_DO_PROBLEMA_HORAS * 3600000;

const podeRelatarProblema = (p) =>
  !!p && [ESTADOS.CONCLUIDO, ESTADOS.AVALIADO].includes(p.estado) && !p.problema && dentroDoPrazoDeProblema(p);

function relatarProblema(pedidoId, { motivoId, texto } = {}) {
  const { conta } = exigirSessao('cliente');
  const lista = todos();
  const i = lista.findIndex((p) => p.id === pedidoId && p.clienteId === conta.id);
  if (i < 0) return { ok: false, erro: 'Pedido não encontrado.' };
  const p = lista[i];

  if (![ESTADOS.CONCLUIDO, ESTADOS.AVALIADO].includes(p.estado)) {
    return { ok: false, erro: 'Só dá para relatar depois que o serviço terminar.' };
  }
  if (p.problema) return { ok: false, erro: 'Você já relatou um problema neste serviço.' };
  if (!dentroDoPrazoDeProblema(p)) {
    return { ok: false, erro: `O prazo para relatar é de ${PRAZO_DO_PROBLEMA_HORAS} horas depois do serviço.` };
  }
  const motivo = MOTIVOS_DE_PROBLEMA.find((m) => m.id === motivoId);
  if (!motivo) return { ok: false, erro: 'Escolha o motivo.' };
  const relato = limparParagrafo(texto, 500);
  if (relato.length < 10) return { ok: false, erro: 'Conte o que aconteceu em pelo menos uma frase.' };

  lista[i] = anotar(
    { ...p, problema: { motivoId: motivo.id, motivo: motivo.nome, texto: relato, abertoEm: new Date().toISOString(), estado: 'aberto' } },
    'Problema relatado pelo cliente',
    'cliente',
  );
  salvarTodos(lista);
  segurarRepasse(p.id, true);
  notificar(p.diaristaId, {
    titulo: 'O cliente relatou um problema',
    mensagem: `${motivo.nome}. O valor deste serviço fica em espera até você responder.`,
    tipo: 'alerta',
    link: `#/servico/${p.id}`,
  });
  publicar(EVENTOS.PEDIDO_MUDOU, { pedidoId, estado: p.estado });
  return { ok: true, pedido: decorar(lista[i], conta) };
}

function responderProblema(pedidoId, { devolver = 0, resposta = '' } = {}) {
  const { conta } = exigirSessao('diarista');
  const lista = todos();
  const i = lista.findIndex((p) => p.id === pedidoId && p.diaristaId === conta.id);
  if (i < 0) return { ok: false, erro: 'Serviço não encontrado.' };
  const p = lista[i];
  if (p.problema?.estado !== 'aberto') return { ok: false, erro: 'Não há problema aberto neste serviço.' };

  const pct = DEVOLUCOES_POSSIVEIS.includes(Number(devolver)) ? Number(devolver) : 0;
  const texto = limparParagrafo(resposta, 500);
  if (pct === 0 && texto.length < 10) {
    return { ok: false, erro: 'Sem devolução, explique ao cliente o que aconteceu.' };
  }

  const arred = (v) => Math.round(v * 100) / 100;
  const valorDevolvido = arred((p.total * pct) / 100);
  const doMeuRepasse = arred(((p.orcamento?.repasseProfissional || 0) * pct) / 100);
  if (doMeuRepasse > 0) {
    estornar({ diaristaId: conta.id, pedidoId, valor: doMeuRepasse, motivo: `Devolução de ${pct}% ao cliente` });
  }
  segurarRepasse(pedidoId, false);

  lista[i] = anotar(
    {
      ...p,
      problema: { ...p.problema, estado: 'resolvido', resposta: texto, devolvidoPct: pct, valorDevolvido, resolvidoEm: new Date().toISOString() },
    },
    pct ? `Problema resolvido com devolução de ${pct}%` : 'Profissional respondeu ao problema',
    'diarista',
  );
  salvarTodos(lista);
  notificar(p.clienteId, {
    titulo: 'O profissional respondeu',
    mensagem: pct ? `${dinheiro(valorDevolvido)} voltam para você no mesmo meio de pagamento.` : 'Veja a resposta no pedido.',
    tipo: pct ? 'sucesso' : 'info',
    link: `#/pedido/${p.id}`,
  });
  publicar(EVENTOS.PEDIDO_MUDOU, { pedidoId, estado: p.estado });
  return { ok: true, pedido: decorar(lista[i], conta) };
}

function retirarProblema(pedidoId) {
  const { conta } = exigirSessao('cliente');
  const lista = todos();
  const i = lista.findIndex((p) => p.id === pedidoId && p.clienteId === conta.id);
  if (i < 0) return { ok: false, erro: 'Pedido não encontrado.' };
  const p = lista[i];
  if (p.problema?.estado !== 'aberto') return { ok: false, erro: 'Não há problema aberto neste pedido.' };

  lista[i] = anotar({ ...p, problema: { ...p.problema, estado: 'retirado', resolvidoEm: new Date().toISOString() } }, 'Cliente retirou o relato', 'cliente');
  salvarTodos(lista);
  segurarRepasse(pedidoId, false);
  notificar(p.diaristaId, {
    titulo: 'O cliente retirou o relato',
    mensagem: 'O valor do serviço volta ao prazo normal de liberação.',
    tipo: 'sucesso',
    link: `#/servico/${p.id}`,
  });
  publicar(EVENTOS.PEDIDO_MUDOU, { pedidoId, estado: p.estado });
  return { ok: true, pedido: decorar(lista[i], conta) };
}

function lembrarProximos() {
  const { conta } = exigirSessao();
  const agora = Date.now();
  let mudou = false;

  const lista = todos().map((p) => {
    const souCliente = p.clienteId === conta.id;
    if ((!souCliente && p.diaristaId !== conta.id) || p.estado !== ESTADOS.AGENDADO) return p;
    const falta = new Date(p.dataHora).getTime() - agora;
    if (falta <= 0 || falta > 24 * 3600000) return p;
    if ((p.lembrados || []).includes(conta.id)) return p;

    const faltaPagar = souCliente && !liberaSaida(p.pagamento);
    notificar(conta.id, {
      titulo: faltaPagar ? 'Seu serviço é em breve e falta pagar' : 'Lembrete de serviço',
      mensagem: `${servicoPorId(p.servicoId)?.nome} ${dataAmigavel(p.dataHora)} às ${hora(p.dataHora)}.${faltaPagar ? ' O profissional só sai com o pagamento confirmado.' : ''}`,
      tipo: faltaPagar ? 'alerta' : 'info',
      link: souCliente ? `#/pedido/${p.id}` : `#/servico/${p.id}`,
    });
    mudou = true;
    return { ...p, lembrados: [...(p.lembrados || []), conta.id] };
  });

  if (mudou) salvarTodos(lista);
  return mudou;
}

function meusClientes() {
  const { conta } = exigirSessao('diarista');
  const notas = perfilDe(conta.id)?.notasDeClientes || {};
  const fixos = new Set(
    ler('assinaturas', []).filter((a) => a.ativa && a.diaristaFixoId === conta.id).map((a) => a.clienteId),
  );

  const mapa = new Map();
  for (const p of todos()) {
    if (p.diaristaId !== conta.id) continue;
    const c = mapa.get(p.clienteId) || { clienteId: p.clienteId, servicos: 0, total: 0, ultimo: null, proximo: null };
    if ([ESTADOS.CONCLUIDO, ESTADOS.AVALIADO].includes(p.estado)) {
      c.servicos += 1;
      c.total += p.orcamento?.repasseProfissional || 0;
      if (!c.ultimo || p.dataHora > c.ultimo) c.ultimo = p.dataHora;
    }
    if ([ESTADOS.AGENDADO, ESTADOS.A_CAMINHO, ESTADOS.EM_ANDAMENTO].includes(p.estado) && (!c.proximo || p.dataHora < c.proximo)) {
      c.proximo = p.dataHora;
    }
    mapa.set(p.clienteId, c);
  }

  return [...mapa.values()]
    .map((c) => {
      const cliente = contaPorId(c.clienteId);
      return {
        ...c,
        total: Math.round(c.total * 100) / 100,
        nome: cliente?.nome || 'Cliente',
        avatar: cliente?.avatar || '',
        fixo: fixos.has(c.clienteId),
        nota: notas[c.clienteId] || '',
      };
    })
    .sort((a, b) => String(b.proximo || b.ultimo || '').localeCompare(String(a.proximo || a.ultimo || '')));
}

function meusGastos() {
  const { conta } = exigirSessao('cliente');
  const meses = new Map();
  for (const p of todos()) {
    if (p.clienteId !== conta.id || ![ESTADOS.CONCLUIDO, ESTADOS.AVALIADO].includes(p.estado)) continue;
    const d = new Date(p.dataHora);
    const chave = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const valor = (p.total || 0) + (p.gorjeta || 0) - (p.problema?.valorDevolvido || 0);
    const m = meses.get(chave) || { mes: chave, total: 0, servicos: 0, porServico: {} };
    const nome = servicoPorId(p.servicoId)?.nome || 'Serviço';
    m.total += valor;
    m.servicos += 1;
    m.porServico[nome] = (m.porServico[nome] || 0) + valor;
    meses.set(chave, m);
  }
  const arred = (v) => Math.round(v * 100) / 100;
  const lista = [...meses.values()]
    .map((m) => ({
      ...m,
      total: arred(m.total),
      porServico: Object.entries(m.porServico).map(([nome, valor]) => ({ nome, valor: arred(valor) })).sort((a, b) => b.valor - a.valor),
    }))
    .sort((a, b) => b.mes.localeCompare(a.mes));
  return { meses: lista, total: arred(lista.reduce((s, m) => s + m.total, 0)), servicos: lista.reduce((s, m) => s + m.servicos, 0) };
}

function ignorarOportunidade(pedidoId) {
  const { conta } = exigirSessao('diarista');
  const lista = todos();
  const i = lista.findIndex((p) => p.id === pedidoId);
  if (i < 0) return { ok: false, erro: 'Pedido não encontrado.' };
  lista[i] = { ...lista[i], recusadoPor: [...(lista[i].recusadoPor || []), conta.id] };
  salvarTodos(lista);

function expirarVencidos() {
  const agora = Date.now();
  let mudou = false;
  const lista = todos().map((p) => {
    if (p.estado !== ESTADOS.PROCURANDO) return p;
    if (new Date(p.expiraEm || 0).getTime() > agora) return p;
    mudou = true;
    notificar(p.clienteId, {
      titulo: 'Pedido expirou',
      mensagem: 'Ninguém aceitou a tempo. Você pode publicar de novo ajustando data ou valor.',
      tipo: 'alerta',
      link: `#/pedido/${p.id}`,

    return anotar({ ...p, estado: ESTADOS.EXPIRADO }, 'Expirado sem propostas', 'sistema');
  });
  if (mudou) salvarTodos(lista);
  return mudou;
}

function estatisticas() {
  const { conta } = exigirSessao();
  const meus = todos().filter((p) => (conta.papel === 'cliente' ? p.clienteId === conta.id : p.diaristaId === conta.id));
  const concluidos = meus.filter((p) => [ESTADOS.CONCLUIDO, ESTADOS.AVALIADO].includes(p.estado));
  const gastoOuGanho = concluidos.reduce(
    (s, p) => s + (conta.papel === 'cliente' ? p.total : p.orcamento?.repasseProfissional || 0),
    0,
  );
  return {
    total: meus.length,
    ativos: meus.filter(estaAtivo).length,
    concluidos: concluidos.length,
    cancelados: meus.filter((p) => p.estado === ESTADOS.CANCELADO).length,
    valorTotal: Math.round(gastoOuGanho * 100) / 100,
    horasTotais: concluidos.reduce((s, p) => s + (p.horas || 0), 0),
    proximo: meus
      .filter((p) => estaAtivo(p) && new Date(p.dataHora) >= new Date())
      .sort((a, b) => new Date(a.dataHora) - new Date(b.dataHora))[0] || null,
  };
}
